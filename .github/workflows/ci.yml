name: Store checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Fails on known high or critical security problems in the shop's libraries.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run format:check
      - run: npm test
      - run: npm run build
