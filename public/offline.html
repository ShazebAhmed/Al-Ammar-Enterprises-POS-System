<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#174f42" />
    <title>You're offline · Al Ammar Store</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #faf9f6;
        color: #152d28;
        font-family: system-ui, sans-serif;
        text-align: center;
        padding: 24px;
      }
      img {
        width: 72px;
        height: 72px;
        border-radius: 18px;
      }
      h1 {
        font-size: 26px;
        margin: 22px 0 8px;
      }
      p {
        color: #66756f;
        font-size: 16px;
        line-height: 1.5;
        margin: 0 0 24px;
      }
      button {
        background: #174f42;
        color: #fff;
        border: 0;
        border-radius: 12px;
        padding: 14px 28px;
        font-size: 16px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>
        Please check your internet connection.<br />Your basket is safe on
        this phone.
      </p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
